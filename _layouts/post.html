---
layout: default
---
<div class="post-header">
  <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}{% if page.tags %} · {{ page.tags | join: ' · ' }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
</div>

<div class="post-content">
  {{ content }}
</div>

<hr>
<p class="post-back"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
