<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title == "Home" or page.layout == "home" %}Shreyanth Suresh Krishnaa{% else %}{{ page.title }}{%
    endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/profile_circle.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false}
      ]
    });"></script>
  {% feed_meta %}
  {% seo %}
  <script>
    (function () {
      /* Apply theme instantly on load — block transitions to prevent flash */
      const doc = document.documentElement;
      doc.classList.add('no-transition');
      const storedTheme = localStorage.getItem('theme');
      if (storedTheme === 'dark') {
        doc.className = 'dark no-transition';
      } else if (storedTheme === 'light') {
        doc.className = 'light no-transition';
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        doc.className = 'dark no-transition';
      } else {
        doc.className = 'light no-transition';
      }
      /* Re-enable transitions after first paint */
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          doc.classList.remove('no-transition');
        });
      });
    })();
  </script>
</head>

<body>
  <nav>
    <a href="{{ '/' | relative_url }}"
      class="nav-home{% if page.url == '/' or page.url == '/index.html' %} active{% endif %}">Shreyanth</a>
    <a href="{{ '/work/' | relative_url }}" {% if page.url contains '/work/' %} class="active" {% endif %}>Work</a>
    <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %} class="active" {% endif
      %}>Projects</a>
    <a href="{{ '/talks/' | relative_url }}" {% if page.url contains '/talks/' %} class="active" {% endif %}>Talks</a>
    <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' or page.layout=='post' %} class="active" {%
      endif %}>Blog</a>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor" />
      </svg>
    </button>
  </nav>
  {{ content }}
  <script>
    const toggleBtn = document.getElementById('theme-toggle');

    toggleBtn.addEventListener('click', function () {
      const doc = document.documentElement;
      const isDark = doc.classList.contains('dark');
      const newTheme = isDark ? 'light' : 'dark';

      /* Colors for the incoming theme */
      const newBg    = newTheme === 'dark' ? '#0d0d10' : '#ffffff';
      const glowColor = newTheme === 'dark'
        ? 'rgba(80, 110, 255, 0.55)'
        : 'rgba(255, 210, 80, 0.55)';

      /* Button center as the ripple origin */
      const rect = toggleBtn.getBoundingClientRect();
      const ox = rect.left + rect.width  / 2;
      const oy = rect.top  + rect.height / 2;

      /* Radius that fully covers the viewport from the origin */
      const maxR = Math.hypot(
        Math.max(ox, window.innerWidth  - ox),
        Math.max(oy, window.innerHeight - oy)
      ) + 32;

      /* Build the ripple overlay */
      const ripple = document.createElement('div');
      ripple.className = 'theme-ripple';
      Object.assign(ripple.style, {
        background:  newBg,
        clipPath:    `circle(0px at ${ox}px ${oy}px)`,
        transition:  'clip-path 0.68s cubic-bezier(0.4, 0, 0.2, 1)',
        '--ripple-glow': glowColor,
      });
      document.body.appendChild(ripple);

      /* Suppress competing CSS transitions under the overlay */
      doc.classList.add('ripple-active');

      /* Page breathe */
      document.body.classList.add('theme-transitioning');
      document.body.addEventListener('animationend', function h() {
        document.body.classList.remove('theme-transitioning');
        document.body.removeEventListener('animationend', h);
      }, { once: true });

      /* Kick off expansion next frame */
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ripple.style.clipPath = `circle(${maxR}px at ${ox}px ${oy}px)`;
        });
      });

      /* Switch actual theme at ~55% through the animation */
      setTimeout(() => {
        doc.classList.remove('dark', 'light');
        doc.classList.add(newTheme);
        localStorage.setItem('theme', newTheme);
      }, 380);

      /* Fade out & remove ripple after animation completes */
      setTimeout(() => {
        doc.classList.remove('ripple-active');
        ripple.style.transition = 'opacity 0.18s ease';
        ripple.style.opacity = '0';
        setTimeout(() => ripple.remove(), 180);
      }, 680);

      /* Icon spin */
      toggleBtn.classList.remove('spinning');
      void toggleBtn.offsetWidth;
      toggleBtn.classList.add('spinning');
      toggleBtn.addEventListener('animationend', function handler() {
        toggleBtn.classList.remove('spinning');
        toggleBtn.removeEventListener('animationend', handler);
      }, { once: true });
    });
  </script>
</body>

</html>
