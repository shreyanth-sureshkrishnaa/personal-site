<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title == "Home" or page.layout == "home" %}Shreyanth Suresh Krishnaa{% else %}{{ page.title }}{%
    endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/profile_circle.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false}
      ]
    });"></script>
  {% feed_meta %}
  {% seo %}
</head>

<body>
  <nav>
    <a href="{{ '/' | relative_url }}"
      class="nav-home{% if page.url == '/' or page.url == '/index.html' %} active{% endif %}">Shreyanth</a>
    <a href="{{ '/work/' | relative_url }}" {% if page.url contains '/work/' %} class="active" {% endif %}>Work</a>
    <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %} class="active" {% endif
      %}>Projects</a>
    <a href="{{ '/talks/' | relative_url }}" {% if page.url contains '/talks/' %} class="active" {% endif %}>Talks</a>
    <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' or page.layout=='post' %} class="active" {%
      endif %}>Blog</a>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor" />
      </svg>
    </button>
  </nav>
  {{ content }}
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var html = document.documentElement;
        var isDark = html.getAttribute('data-theme') === 'dark';

        /* Smooth icon spin */
        btn.classList.remove('spinning');
        requestAnimationFrame(function () {
          btn.classList.add('spinning');
        });
        btn.addEventListener('animationend', function handler() {
          btn.classList.remove('spinning');
          btn.removeEventListener('animationend', handler);
        }, { once: true });

        if (isDark) {
          html.removeAttribute('data-theme');
          try { localStorage.setItem('theme', 'light'); } catch (e) {}
        } else {
          html.setAttribute('data-theme', 'dark');
          try { localStorage.setItem('theme', 'dark'); } catch (e) {}
        }
      });
    })();
  </script>
</body>

</html>
